name: Ziyo Akademiya Android CI

on:
  push:
    branches:
      - feature/full-math-curriculum
      - main
      - master
  pull_request:
    branches:
      - feature/full-math-curriculum
      - main
      - master
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to run build on'
        required: false
        default: 'feature/full-math-curriculum'

jobs:
  build:
    name: Build & Test Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew --no-daemon clean testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify APK Generated
        run: |
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "SUCCESS: Debug APK generated successfully."
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "ERROR: Expected APK not found at app/build/outputs/apk/debug/app-debug.apk"
            find app/build/outputs/ -type f || true
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ziyo-akademiya-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
